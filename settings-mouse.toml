title = "pick-full-wm"

[applications]
startups = [ "xfce4-panel" ]
excluded = [ "xfce4-panel" ] # matched against window class (WM_CLASS)

[layout]
main_size = [ "80%x97%", "80%x100%" ] # define per monitor
top_left = [ "0,3%", "0,0" ] # define per monitor
side_orientation = "right" # left / right / both
conditional_full = true # fill side if none
new_to_main = true # new windows fill main area, rather than send to side
swap_not_stack = true # main should replace chosen side, not go to bottom
close_box = true
monitor_box = true
split_box = true # button on each side area to split it into main
pop_box = true # button on a split main to pop its right-most window

[bindings]
swaps = [ "j", "k", "l", ";", "u", "i", "o", "p" ]
super_for_clicks = false # need to hold super for swapping via clicks
focus_follows_mouse = true # hovering a main area window focuses it (side windows never)
close_main = "q" # close focused main window (hold shift for the whole main area)
force_kill = "esc" # force kill focused main window, for hung apps (hold shift for the whole main area)
fullscreen = "f"
split = "s" # next swap joins main instead of replacing it (hold shift to pop the last off)
cycle_split = "c" # move the keyboard to the next window of a split main (left to right, looping)
help = "h"
key_hints = false
workspaces = [ "1", "2", "3", "4" ] # also defines how many
monitor = "tab" # cycle monitor index (hold shift for monitor move)

[bindings.functions]
t = "alacritty"
b = "firefox-esr"
e = "thunar"
briu = "brightnessctl set +10%"
brid = "brightnessctl set 10%-"
volu = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
vold = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
mute = "wpctl set-mute @DEFAULT_SINK@ toggle"

[files]
log_directory = "~/.local/share/pick-full-wm/logs"
